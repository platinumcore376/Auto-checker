services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-insecure-secret-key-at-least-32-chars-long}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin@rait.ac.in}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-$2b$12$e8gV1wK95aXkR7zE94QOtefH/x8yUqZ8xK9Z9K9Z9K9Z9K9Z9K9Z9}
    volumes:
      - ./backend:/app
    command: python -m uvicorn server:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend
