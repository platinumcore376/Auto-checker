name: CI Pipeline

on:
  push:
    branches: [main, prak_check]
  pull_request:
    branches: [main, prak_check]

jobs:
  backend-test:
    name: Backend Pytest & Coverage
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: "ci-dummy-secret-key-at-least-32-chars-long-for-testing"
      ADMIN_USERNAME: "admin@rait.ac.in"
      ADMIN_PASSWORD_HASH: "$2b$12$e8gV1wK95aXkR7zE94QOtefH/x8yUqZ8xK9Z9K9Z9K9Z9K9Z9K9Z9"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (Poppler & OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite with Coverage
        run: |
          pytest backend/tests --cov=backend --cov-report=term-missing -v

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript typecheck & production build
        run: npm run build
